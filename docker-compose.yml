services:
  newsroom:
    build: .
    image: newsroom:latest
    restart: unless-stopped
    ports:
      - "8077:8077"
    environment:
      NEWSROOM_PASSWORD: ${NEWSROOM_PASSWORD:?NEWSROOM_PASSWORD ayarlanmalı}
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - newsroom-data:/data

volumes:
  newsroom-data:
